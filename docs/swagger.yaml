  "/api/users/change-password":
    post:
      tags:
        - "Users"
      summary: "Change password for the authenticated user"
      description: |
        Changes the password of the currently logged-in user (mobile app account screen).
        Requires the access token in the `Authorization: Bearer` header and the current password.
        On success the user's login attempts / lock are cleared and a notification email is sent.
      operationId: postApiUsersChangePassword
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                "current_password":
                  type: string
                  format: password
                  description: "The user's existing password (alias: old_password)."
                  example: "OldPass123"
                "new_password":
                  type: string
                  format: password
                  description: "New password, minimum 6 characters, must differ from current."
                  example: "NewPass456"
                "confirm_password":
                  type: string
                  format: password
                  description: "Must match new_password (alias: new_password_confirmation)."
                  example: "NewPass456"
            example:
              current_password: "OldPass123"
              new_password: "NewPass456"
              confirm_password: "NewPass456"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              example:
                status: "success"
                message: "Password changed successfully"
        "400":
          description: |
            Validation failed — missing fields, new/confirm mismatch, new password shorter
            than 6 characters, new password same as current, or current password incorrect.
        "401":
          description: Missing, invalid, or expired bearer token
        "404":
          description: User not found
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/users/delete-account":
    post:
      tags:
        - "Users"
      summary: "Delete authenticated user account"
      description: "Deletes the currently authenticated non-admin account. Use a Bearer access token; refresh_token is only an optional fallback when the access token is missing or invalid. Password confirmation is always required."
      operationId: postApiUsersDeleteAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                "refresh_token":
                  type: string
                  description: "Optional fallback from the login response. Do not send this when a valid Bearer access token is being used."
                  example: "refresh-token-from-login"
                "password":
                  type: string
                  format: password
                  description: "Current user's password used to confirm permanent account deletion."
                  example: "password"
      responses:
        "200":
          description: Account and associated personal data deleted successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "400":
          description: Password is missing or incorrect
        "401":
          description: Valid Bearer access token or refresh token is required
        "403":
          description: Administrators cannot delete their own accounts through this API
        "404":
          description: User not found
