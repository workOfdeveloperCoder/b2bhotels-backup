                      example: "KHI"
                    destination:
                      type: string
                      example: "DXB"
                    departure_date:
                      type: string
                      format: date
                      example: "2026-08-01"
                    return_date:
                      type: string
                      nullable: true
                      format: date
                      example: null
                    adults:
                      type: integer
                      example: 1
                    children:
                      type: integer
                      example: 0
                    infants:
                      type: integer
                      example: 0
                    type:
                      type: string
                      enum: [oneway, return, multicity]
                      example: "oneway"
                    class:
                      type: string
                      example: "economy"
                "currency":
                  type: string
                  example: "USD"
