                  departure_code: "LHE"
                  arrival_code: "DXB"
                  departure_date: "2026-08-01"
                  departure_time: "06:00"
                  arrival_time: "08:30"
                  duration: "3h 30m"
                  class: "economy"
                  type: "oneway"
