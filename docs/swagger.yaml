  "/api/stays/booking/draft":
    post:
      tags:
        - "Stays"
      summary: "Save a stays booking draft"
      description: "Stores the selected hotel and room data and returns the 16-character hash required by the Stays booking submit API."
      operationId: postApiStaysBookingDraft
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotel_id]
              properties:
                hotel_id:
                  type: integer
                  example: 200
                hotel_name:
                  type: string
                  example: "Burj Al Arab"
                hotel_address:
                  type: string
                  example: "Jumeirah Beach Road"
                hotel_stars:
                  type: integer
                  example: 2
                supplier:
                  type: string
                  example: "hotels"
                checkin:
                  type: string
                  format: date
                  example: "2026-08-10"
                checkout:
                  type: string
                  format: date
                  example: "2026-08-12"
                nights:
                  type: integer
                  minimum: 1
                  example: 2
                nationality:
                  type: string
                  example: "PK"
                rooms_data:
                  type: array
                  items:
                    type: object
                    required: [adults, children]
                    properties:
                      adults:
                        type: integer
                        minimum: 1
                        example: 2
                      children:
                        type: integer
                        minimum: 0
                        example: 0
                      childAges:
                        type: array
                        items:
                          type: integer
                        example: []
                selected_rooms:
                  type: array
                  items:
                    type: object
                    required: [room_id, room_name, quantity, option]
                    properties:
                      room_id:
                        type: integer
                        example: 2000
                      room_name:
                        type: string
                        example: "Deluxe Room"
                      room_type_id:
                        type: integer
                        example: 44
                      quantity:
                        type: integer
                        minimum: 1
                        example: 1
                      option:
                        type: object
                        properties:
                          price:
                            type: number
                            example: 1500
                          board_name:
                            type: string
                            example: "Breakfast Included"
                          breakfast_included:
                            type: boolean
                            example: true
                          refundable:
                            type: boolean
                            example: true
                actual_amount:
                  type: number
                  description: "Supplier/base total before markup."
                  example: 3000
                currency:
                  type: string
                  example: "USD"
                rooms_count:
                  type: integer
                  example: 1
                book_hash:
                  type: string
                  description: "Optional supplier booking reference returned by the room availability API."
                  example: ""
              example:
                hotel_id: 200
                hotel_name: "Burj Al Arab"
                hotel_address: "Jumeirah Beach Road"
                hotel_stars: 2
                supplier: "hotels"
                checkin: "2026-08-10"
                checkout: "2026-08-12"
                nights: 2
                nationality: "PK"
                rooms_data:
                  - adults: 2
                    children: 0
                    childAges: []
                selected_rooms:
                  - room_id: 2000
                    room_name: "Deluxe Room"
                    room_type_id: 44
                    quantity: 1
                    option:
                      price: 1500
                      board_name: "Breakfast Included"
                      breakfast_included: true
                      refundable: true
                actual_amount: 3000
                currency: "USD"
                rooms_count: 1
                book_hash: ""
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
