        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flight_data]
              properties:
                "flight_data":
                  type: object
                  description: Exact selected flight object returned by the flight supplier search.
                  required: [supplier, price]
                  properties:
                    supplier:
                      type: string
                      example: "duffel"
                    flight_number:
                      type: string
                      example: "EK603"
                    airline_name:
                      type: string
                      example: "Emirates"
                    departure_code:
                      type: string
                      example: "KHI"
                    arrival_code:
                      type: string
                      example: "DXB"
                    departure_date:
                      type: string
                      format: date
                      example: "2026-08-01"
                    departure_time:
                      type: string
                      example: "10:00"
                    arrival_time:
                      type: string
                      example: "11:15"
                    duration:
                      type: string
                      example: "2h 15m"
                    class:
                      type: string
                      example: "economy"
                    type:
                      type: string
                      enum: [oneway, return, multicity]
                      example: "oneway"
                    price:
                      type: number
                      format: float
                      example: 250
                    actual_price:
                      type: number
                      format: float
                      example: 250
                    currency:
                      type: string
                      example: "USD"
                    refundable:
                      type: boolean
                      example: false
                    segments:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    booking_data:
                      type: object
                      description: Supplier booking data returned by the search response.
                      properties:
                        flight_id:
                          type: integer
                          description: Local flight ID when supplier is flights.
                        offer_id:
                          type: string
                          description: Live Duffel offer ID returned by supplier search.
                        booking_token:
                          type: string
