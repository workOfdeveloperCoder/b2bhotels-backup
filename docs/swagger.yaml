  "/api/payment/bank-transfer":
    get:
      tags:
        - "Payments"
      summary: "Get Wire Transfer (Bank Details) form for the mobile app"
      description: |
        Returns the bank details configured for the active **Wire / Bank Transfer** gateway
        so the mobile app can render its wire-transfer payment screen (Account Holder,
        Routing Number, Account Number, Bank Name / Address, IBAN / SWIFT, Currency and
        payment instructions).

        `iban`, `swift` and `iban_swift` all carry the single configured IBAN/SWIFT value;
        `bank_name` and `bank_address` carry the same configured bank address.
        A leading field label typed into a value by the admin (e.g. `"Account holder Elon Musk"`)
        is stripped, so each field holds the bare value.
        Returns `404` when no bank-transfer gateway is active.
      operationId: getApiPaymentBankTransfer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Wire transfer bank details retrieved successfully
          content:
            application/json:
              example:
                status: "success"
                success: true
                message: "Wire transfer details retrieved successfully"
                data:
                  id: 5
                  name: "Wire Transfer"
                  display_name: "Wire Transfer"
                  type: "bank_transfer"
                  account_holder: "Elon Musk"
                  routing_number: "084009519"
                  account_number: "9600001474383599"
                  bank_name: "26th Street, Sixth Floor New York NY 10010 United States"
                  bank_address: "26th Street, Sixth Floor New York NY 10010 United States"
                  iban: "GBPXXXIP0024456987"
                  swift: "GBPXXXIP0024456987"
                  iban_swift: "GBPXXXIP0024456987"
                  currency: "USD"
                  instructions: "Please transfer the total amount to the bank account above and submit your payment proof."
                  logo: "http://example.com/uploads/gateways/bank-transfer.png"
        "404":
          description: Wire transfer is not available (no active bank-transfer gateway)
        "426":
          $ref: '#/components/responses/InvalidApiKey'
