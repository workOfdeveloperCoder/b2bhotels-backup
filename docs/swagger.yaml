                booking_hash: "f896ccbd0940b553"
                guest_details:
                  primary_guest:
                    title: "Mr"
                    first_name: "John"
                    last_name: "Smith"
                    email: "john@example.com"
                    country_code: "PK"
                    phone: "3321231233"
                  booking_for_someone_else: false
                  travelers: {}
                  selected_payment: "7"
                  special_requests: ""
                  terms_accepted: true
                final_total: 3000
                display_total: 3000
                subtotal: 3000
                tax_amount: 0
                base_currency: "USD"
                display_currency: "USD"
                promo_code: ""
                promo_discount: 0
      responses:
