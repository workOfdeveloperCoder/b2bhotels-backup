openapi: 3.0.3

info:
  title: API Docs
  description: JSON API route response.
  version: 1.0.0

servers:
  - url: .

tags:
  - name: "User Authentication"
    description: "User Authentication routes"
  - name: "AI"
    description: "AI routes"
  - name: "App Settings"
    description: "App Settings routes"
  - name: "Blog"
    description: "Blog routes"
  - name: "Bookings"
    description: "Bookings routes"
  - name: "Bus"
    description: "Bus routes"
  - name: "Cars"
    description: "Cars routes"
  - name: "CMS"
    description: "CMS routes"
  - name: "Contact"
    description: "Contact routes"
  - name: "Countries"
    description: "Countries routes"
  - name: "Cron Jobs"
    description: "Cron Jobs routes"
  - name: "Deposits"
    description: "Deposits routes"
  - name: "eSIM"
    description: "eSIM routes"
  - name: "Ferries"
    description: "Ferries routes"
  - name: "Flights"
    description: "Flights routes"
  - name: "General"
    description: "General routes"
  - name: "Localization"
    description: "Localization routes"
  - name: "Modules"
    description: "Modules routes"
  - name: "Navigation"
    description: "Navigation routes"
  - name: "Payments"
    description: "Payments routes"
  - name: "Promo Codes"
    description: "Promo Codes routes"
  - name: "Rail"
    description: "Rail routes"
  - name: "Stays"
    description: "Stays routes"
  - name: "Theme"
    description: "Theme routes"
  - name: "Tours"
    description: "Tours routes"
  - name: "Umrah"
    description: "Umrah routes"
  - name: "Users"
    description: "Users routes"
  - name: "Visa"
    description: "Visa routes"

paths:
  "/api/captcha":
    get:
      tags:
        - "User Authentication"
      summary: "Get signup CAPTCHA challenge"
      description: "Returns the CAPTCHA question, hash, and timestamp required by the signup API."
      operationId: getApiCaptcha
      responses:
        "200":
          description: CAPTCHA challenge generated successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/signup":
    post:
      tags:
        - "User Authentication"
      summary: "Submit api signup"
      operationId: postApiSignup
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, confirm_password, terms, captcha_answer, captcha_hash, captcha_timestamp]
              properties:
                "first_name":
                  type: string
                  example: "string"
                "last_name":
                  type: string
                  example: "string"
                "email":
                  type: string
                  format: email
                  example: "user@example.com"
                "password":
                  type: string
                  format: password
                  example: "password"
                "confirm_password":
                  type: string
                  format: password
                  example: "password"
                "phone":
                  type: string
                  example: "string"
                "phone_country_code":
                  type: string
                  example: "string"
                "terms":
                  type: boolean
                  example: true
                "user_type":
                  type: string
                  example: "string"
                "captcha_answer":
                  type: string
                  example: "string"
                "captcha_hash":
                  type: string
                  example: "string"
                "captcha_timestamp":
                  type: integer
                  example: 1
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/login":
    post:
      tags:
        - "User Authentication"
      summary: "Submit api login"
      operationId: postApiLogin
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                remember_me:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Login processed; response body contains success or error details
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/forgot-password":
    post:
      tags:
        - "User Authentication"
      summary: "Submit api forgot password"
      operationId: postApiForgotPassword
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                "email":
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/resend-password-otp":
    post:
      tags:
        - "User Authentication"
      summary: "Submit api resend password otp"
      operationId: postApiResendPasswordOtp
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                "email":
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/verify-otp":
    post:
      tags:
        - "User Authentication"
      summary: "Submit api verify otp"
      operationId: postApiVerifyOtp
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, action]
              properties:
                "email":
                  type: string
                  format: email
                  example: "user@example.com"
                "otp":
                  type: string
                  example: "string"
                "action":
                  type: string
                  example: "string"
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/reset-password":
    post:
      tags:
        - "User Authentication"
      summary: "Submit api reset password"
      operationId: postApiResetPassword
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirm_password]
              properties:
                "token":
                  type: string
                  example: "string"
                "otp":
                  type: string
                  example: "string"
                "password":
                  type: string
                  format: password
                  example: "password"
                "confirm_password":
                  type: string
                  format: password
                  example: "password"
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/users/logout":
    post:
      tags:
        - "User Authentication"
      summary: "Log out the authenticated user"
      description: "Requires the access token in the Authorization Bearer header. No request body is required."
      operationId: postApiUsersLogout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "401":
          description: Authorization token is missing, invalid, or expired
  "/api/ai/search":
    get:
      tags:
        - "AI"
      summary: "Get api ai search"
      operationId: getApiAiSearch
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Type what you want to search for.
          schema:
            type: string
            example: Flights from Lahore to Dubai tomorrow
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/ai/trip/save-draft":
    post:
      tags:
        - "AI"
      summary: "Save selected AI trip items as a draft"
      description: "Stores one or more selected trip results and returns the booking hash required by the AI trip submit API."
      operationId: postApiAiTripSaveDraft
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                type:
                  type: string
                  example: "ai_trip"
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [module, title, price, currency]
                    properties:
                      key:
                        type: string
                        example: "flights::LHE-DXB"
                      module:
                        type: string
                        example: "flights"
                      kind:
                        type: string
                        example: "flights"
                      title:
                        type: string
                        example: "Lahore to Dubai Flight"
                      subtitle:
                        type: string
                        example: "One-way Economy"
                      price:
                        type: number
                        example: 100
                      currency:
                        type: string
                        example: "USD"
                      supplier:
                        type: string
                        example: "duffel"
                      params:
                        type: object
                        properties:
                          origin:
                            type: string
                            example: "LHE"
                          destination:
                            type: string
                            example: "DXB"
                          departure_date:
                            type: string
                            example: "23-07-2026"
                          adults:
                            type: string
                            example: "1"
                          type:
                            type: string
                            example: "oneway"
                          class:
                            type: string
                            example: "economy"
                query:
                  type: string
                  example: "Flights from Lahore to Dubai tomorrow"
                currency:
                  type: string
                  example: "USD"
                module_order:
                  type: array
                  items:
                    type: string
                  example: ["flights"]
                total:
                  type: number
                  example: 100
      responses:
        "200":
          description: Draft saved successfully and booking hash returned
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "400":
          description: No items selected, invalid request, or AI Trip Planner disabled
  "/api/ai/trip/submit":
    post:
      tags:
        - "AI"
      summary: "Submit an AI trip booking"
      description: "Completes the saved AI trip draft using its booking hash, guest details, passenger information, payment gateway, and accepted terms."
      operationId: postApiAiTripSubmit
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_hash, guest_details]
              properties:
                booking_hash:
                  type: string
                  description: "Hash returned by the AI trip save-draft API."
                  example: "7e1877c3dff1bcd8"
                promo_code:
                  type: string
                  example: ""
                promo_discount:
                  type: number
                  example: 0
                guest_details:
                  type: object
                  required: [primary_guest, selected_payment, terms_accepted]
                  properties:
                    primary_guest:
                      type: object
                      required: [first_name, last_name, email, phone]
                      properties:
                        title:
                          type: string
                          example: "Mr"
                        first_name:
                          type: string
                          example: "John"
                        last_name:
                          type: string
                          example: "Smith"
                        email:
                          type: string
                          format: email
                          example: "john@example.com"
                        country_code:
                          type: string
                          example: "PK"
                        phone:
                          type: string
                          example: "3321231233"
                    passengers:
                      type: object
                      properties:
                        adult_0:
                          type: object
                          properties:
                            title:
                              type: string
                              example: "Mr"
                            first_name:
                              type: string
                              example: "John"
                            last_name:
                              type: string
                              example: "Smith"
                            nationality:
                              type: string
                              example: "PK"
                            dob_day:
                              type: string
                              example: "01"
                            dob_month:
                              type: string
                              example: "01"
                            dob_year:
                              type: string
                              example: "1990"
                            passport_number:
                              type: string
                              example: "AB1234567"
                            passport_expiry_day:
                              type: string
                              example: "01"
                            passport_expiry_month:
                              type: string
                              example: "01"
                            passport_expiry_year:
                              type: string
                              example: "2030"
                    selected_payment:
                      type: string
                      description: "Active payment gateway ID or code."
                      example: "7"
                    special_requests:
                      type: string
                      example: ""
                    terms_accepted:
                      type: boolean
                      example: true
                    promo_code:
                      type: string
                      example: ""
                    promo_discount:
                      type: number
                      example: 0
      responses:
        "200":
          description: Trip booking processed; successful response contains a redirect URL
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "400":
          description: Invalid booking hash, missing guest details, payment method, or terms
  "/api/info":
    get:
      tags:
        - "App Settings"
      summary: "Get api info"
      operationId: getApiInfo
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/app-settings":
    get:
      tags:
        - "App Settings"
      summary: "Get api app settings"
      operationId: getApiAppSettings
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/blogs":
    get:
      tags:
        - "Blog"
      summary: "Get api blogs"
      operationId: getApiBlogs
      security:
        - ApiKeyAuth: []
      parameters:
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: "en"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 5
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/blogs/{slug}":
    get:
      tags:
        - "Blog"
      summary: "Get api blogs slug"
      operationId: getApiBlogsSlug
      security:
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: "en"
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/booking/update-payment-gateway":
    post:
      tags:
        - "Bookings"
      summary: "Submit api booking update payment gateway"
      description: "Requires an active PHP login session."
      operationId: postApiBookingUpdatePaymentGateway
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, payment_gateway]
              properties:
                "invoice_id":
                  type: integer
                  example: 1
                "payment_gateway":
                  type: string
                  example: "string"
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/bookings":
    post:
      tags:
        - "Bookings"
      summary: "Get authenticated user's bookings"
      description: "Returns the logged-in user's bookings and summary statistics. Requires a valid Bearer access token."
      operationId: postApiBookings
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                "filter":
                  type: string
                  description: "Filter bookings by module type."
                  enum: [all, flight, hotel, visa, holiday, ferries, esim, ai_trip]
                  default: all
                  example: "all"
      responses:
        "200":
          description: User bookings and statistics returned successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "401":
          description: Bearer token is missing, invalid, or expired
  "/api/clear-checkout":
    post:
      tags:
        - "Bookings"
      summary: "Submit api clear checkout"
      operationId: postApiClearCheckout
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/store-booking":
    post:
      tags:
        - "Bookings"
      summary: "Store temporary flight checkout data"
      description: "Stores selected flight and search information in the current PHP session. This does not create a final booking."
      operationId: postApiStoreBooking
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, booking_hash, search_params, booking_data]
              properties:
                module:
                  type: string
                  example: "flights"
                booking_hash:
                  type: string
                  example: "71785774"
                search_params:
                  type: object
                  properties:
                    origin:
                      type: string
                      example: "LHE"
                    destination:
                      type: string
                      example: "DXB"
                    departure_date:
                      type: string
                      example: "23-07-2026"
                    adults:
                      type: integer
                      example: 1
                    class:
                      type: string
                      example: "economy"
                booking_data:
                  type: object
                  properties:
                    title:
                      type: string
                      example: "Lahore to Dubai Flight"
                    price:
                      type: number
                      example: 100
                    currency:
                      type: string
                      example: "USD"
                    supplier:
                      type: string
                      example: "duffel"
      responses:
        "200":
          description: Flight checkout data stored in the session
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "400":
          description: Invalid or empty booking data
  "/api/booking/resend-invoice":
    post:
      tags:
        - "Bookings"
      summary: "Submit api booking resend invoice"
      operationId: postApiBookingResendInvoice
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id]
              properties:
                "invoice_id":
                  type: string
                  example: "AB12CD34"
                "customer_email":
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/bus/listing":
    post:
      tags:
        - "Bus"
      summary: "Submit api bus listing"
      operationId: postApiBusListing
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [origin, destination]
              properties:
                "origin":
                  type: string
                  example: "string"
                "destination":
                  type: string
                  example: "string"
                "date":
                  type: string
                  format: date
                  example: "2026-07-20"
                "passengers":
                  type: integer
                  example: 1
      responses:
        "200":
          description: Request processed successfully
        "426":
          $ref: '#/components/responses/InvalidApiKey'
  "/api/bus/booking/draft":
    post:
      tags:
        - "Bus"
      summary: "Create a bus booking draft"
      description: |
        Use a route_id returned by POST /api/bus/listing. Pass the same `currency` used on listing
        (or include the full `trip` object from listing — its `currency` is used as fallback).
        Response totals and `booking_data.trip` fares are returned in display currency.
      operationId: postApiBusBookingDraft
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_id, date]
              properties:
                route_id:
                  type: integer
                  description: "route_id returned by POST /api/bus/listing."
                  example: 1
                date:
                  type: string
                  description: "Journey date in DD-MM-YYYY format."
                  example: "30-07-2026"
                currency:
                  type: string
                  description: "Display currency (same as listing search). Falls back to trip.currency or session."
                  example: "PKR"
                trip:
                  type: object
                  description: "Optional trip object copied from POST /api/bus/listing (recommended for mobile)."
                  additionalProperties: true
                trip_type:
                  type: string
                  enum: [oneway, return]
                  example: "oneway"
                adults:
                  type: integer
                  example: 1
                children:
                  type: integer
                  example: 0
            example:
              route_id: 1
              date: "30-07-2026"
              currency: "PKR"
              adults: 2
              children: 0
              trip:
                route_id: 1
                price: 3500
                adult_price: 3500
                child_price: 1750
                currency: "PKR"
                base_currency: "USD"
      responses:
        "200":
          description: |
            Draft created. Use top-level `total` / `amount_base` for checkout totals.
            `currency` and `display_currency` are the converted display code; `booking_data.trip` fares match listing currency.
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "400":
          description: Invalid route/date or insufficient available seats
  "/api/bus/booking/draft/{hash}":
    get:
      tags:
        - "Bus"
      summary: "Get a saved bus booking draft"
      description: "Enter the hash returned by POST /api/bus/booking/draft. Optional ?currency=PKR re-converts live totals and trip fares."
      operationId: getApiBusBookingDraftHash
      security:
        - ApiKeyAuth: []
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{16}$"
            example: "7e1877c3dff1bcd8"
        - name: currency
          in: query
          required: false
          schema:
            type: string
            example: "PKR"
          description: Display currency for live re-pricing (defaults to draft display currency).
      responses:
        "200":
          description: Saved draft returned with live recalculated price
        "426":
          $ref: '#/components/responses/InvalidApiKey'
        "404":
          description: Booking draft not found or expired
  "/api/bus/booking/app-submit":
    post:
      tags:
        - "Bus"
      summary: "Submit a bus booking from a saved draft"
      description: "Creates the final bus booking using the hash returned by POST /api/bus/booking/draft."
      operationId: postApiBusBookingAppSubmit
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash, guest, payment_gateway, display_currency]
              properties:
                hash:
                  type: string
                  pattern: "^[a-f0-9]{16}$"
                  description: "Hash returned by the bus booking draft API."
                  example: "7e1877c3dff1bcd8"
                guest:
                  type: object
                  required: [first_name, last_name, email]
                  properties:
                    first_name:
                      type: string
                      example: "John"
                    last_name:
                      type: string
                      example: "Smith"
                    email:
                      type: string
                      format: email
                      example: "john@example.com"
                    phone_country_code:
                      type: string
                      example: "+92"
                    phone:
                      type: string
                      example: "3321231233"
                    country:
                      type: string
                      example: "PK"
                    special_requests:
                      type: string
                      example: ""
                promo_code:
                  type: string
                  example: ""
                promo_discount:
                  type: number
                  example: 0
                payment_gateway:
                  type: string
                  description: "Active payment gateway ID or name."
                  example: "7"
                base_currency:
                  type: string
                  example: "USD"
                display_currency:
                  type: string
                  description: "Currency in which the final amount should be displayed."
                  example: "USD"
                travellers:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [adult, child]
                        example: "adult"
                      title:
                        type: string
                        example: "Mr"
                      first_name:
                        type: string
                        example: "John"
                      last_name:
                        type: string
                        example: "Smith"
                      age:
                        type: integer
                        example: 30
      responses:
        "200":
          description: Booking created; response contains invoice ID, amount, and redirect URL
        "426":
          $ref: '#/components/responses/InvalidApiKey'
