                  type: number
                  example: 3000
                subtotal:
                  type: number
                  example: 3000
                tax_amount:
                  type: number
                  example: 0
                base_currency:
                  type: string
                  example: "USD"
                display_currency:
                  type: string
                  example: "USD"
                promo_code:
                  type: string
                  example: ""
                promo_discount:
                  type: number
                  example: 0
