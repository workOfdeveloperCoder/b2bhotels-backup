  "/api/ferries/search":
    post:
      tags:
        - "Ferries"
      summary: "Search ferry sailings (one-way or round-trip)"
      description: |
        Returns sailings for the requested route and date(s).
        - One-way: set `trip_type` to `oneway` (default) and omit `return_date`.
        - Round-trip: set `trip_type` to `return` and send `return_date` (YYYY-MM-DD).
        Response `data.outbound` holds departure-leg sailings; `data.return` holds return-leg sailings (empty for one-way).
        No sailing selection is required in this request — pick outbound/return sailings after search, then call booking draft.

        **Pet Ticket Type IDs (`pets[].ticket_type_id`)** — the booking site shows these as **Carrier**, **Medium cage** and **Large cage**:
        - `22`: Pet with carrier — web **Carrier** (small pet in a travel carrier / crib) — FRS
        - `23`: Pet without carrier — web **Medium cage** / **Large cage** (kennel / vehicle accommodation) — FRS
        - `35`: Pet — Baleària's single pet ticket type. Kikoto only distinguishes
          with-carrier vs without-carrier (never cage size), so all three web options
          (Carrier / Medium cage / Large cage) resolve to `35` for Baleària.

        **Vehicle Ticket Type IDs (`vehicles[].ticket_type_id`)** — the lower id is FRS, the higher id Baleària:
        - `14` or `27`: Car (Standard passenger automobile)
        - `15` or `28`: Van (Van / Campervan / Large vehicle)
        - `17` or `30`: Motorcycle (Heavy motorcycle)
        - `18` or `31`: Moped (Scooter / Light moped)
        - `21` or `32`: Bicycle (Push bike)
        - `34`: Trailer (Baleària; car / cargo trailer) — selectable on the booking
          form only, not offered as a search-time vehicle preference.
      operationId: postApiFerriesSearch
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departure_port_id, destination_port_id, date]
              properties:
                "departure_port_id":
                  type: integer
                  example: 1
                  description: Departure port ID returned by POST /api/ferries/ports.
                "destination_port_id":
                  type: integer
                  example: 2
                  description: Destination port ID returned by POST /api/ferries/ports.
                "date":
                  type: string
                  format: date
                  example: "2026-08-15"
                  description: Outbound sailing date (YYYY-MM-DD).
                "trip_type":
                  type: string
                  enum: [oneway, return]
                  default: oneway
                  example: "return"
                  description: Trip type. When `return`, `return_date` is required.
                "return_date":
                  type: string
                  format: date
                  nullable: true
                  example: "2026-08-20"
                  description: Return sailing date (YYYY-MM-DD). Required when `trip_type` is `return`.
                "adults":
                  type: integer
                  minimum: 1
                  example: 2
                "children":
                  type: integer
                  minimum: 0
                  example: 0
                "infant":
                  type: integer
                  minimum: 0
                  example: 0
                "currency":
                  type: string
                  example: "USD"
                  description: Display currency code (session currency used when omitted).
                "lang":
                  type: string
                  example: "en"
                  description: Language code for supplier content.
                "vehicles":
                  type: array
                  description: |
                    Cars or other vehicles travelling with the passengers.
                    Ticket Type IDs (lower = FRS, higher = Baleària):
                    - 14 or 27: Car
                    - 15 or 28: Van
                    - 17 or 30: Motorcycle
                    - 18 or 31: Moped
                    - 21 or 32: Bicycle
                    - 34: Trailer (Baleària only; booking form, not search)
                  items:
                    type: object
                    required: [ticket_type_id, count]
                    properties:
                      ticket_type_id:
                        type: integer
                        nullable: true
                        example: 14
                      count:
                        type: integer
                        nullable: true
                        minimum: 1
                        example: 1
                "pets":
                  type: array
                  description: |
                    Pets travelling with the passengers.
                    On the booking site the choice is shown as Carrier / Medium cage / Large cage,
                    but Kikoto only distinguishes with-carrier vs without-carrier (never cage size).
                    Ticket Type IDs:
                    - 22: Pet with carrier (FRS) — web "Carrier"
                    - 23: Pet without carrier (FRS) — web "Medium cage" / "Large cage"
                    - 35: Pet (Baleària's single pet type; all three web options resolve to it)
                  items:
                    type: object
                    required: [ticket_type_id, count]
                    properties:
                      ticket_type_id:
                        type: integer
                        nullable: true
                        example: 22
                      count:
                        type: integer
                        nullable: true
                        minimum: 1
                        example: 1
            examples:
              roundTrip:
                summary: Round-trip search
                value:
                  departure_port_id: 1
                  destination_port_id: 2
                  date: "2026-08-15"
                  trip_type: "return"
                  return_date: "2026-08-20"
                  adults: 2
                  children: 0
                  infant: 0
                  currency: "USD"
                  lang: "en"
              withVehicleAndPet:
                summary: Search with Vehicle and Pet
                value:
                  departure_port_id: 1
                  destination_port_id: 2
                  date: "2026-08-15"
                  trip_type: "oneway"
                  adults: 2
                  children: 0
                  infant: 0
                  currency: "USD"
                  lang: "en"
                  vehicles:
                    - ticket_type_id: 14
                      count: 1
                  pets:
                    - ticket_type_id: 22
                      count: 1
              oneWay:
                summary: One-way search
                value:
                  departure_port_id: 1
                  destination_port_id: 2
                  date: "2026-08-01"
                  trip_type: "oneway"
                  adults: 1
                  children: 0
                  infant: 0
                  currency: "USD"
                  lang: "en"
      responses:
        "200":
          description: Sailings returned in `data.outbound` and (for round-trip) `data.return`.
        "422":
          description: Validation error (e.g. missing return_date for round-trip).
        "426":
          $ref: '#/components/responses/InvalidApiKey'
